name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install numpy pandas scipy scikit-learn matplotlib seaborn tqdm joblib

      - name: Lint with ruff (real errors only)
        run: ruff check src/

      - name: Test imports
        run: |
          cd src
          python -c "import config, data_loader, windowing, features, ml_models, evaluate; print('All imports OK')"
